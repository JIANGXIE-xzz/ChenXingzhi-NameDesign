<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Liquid Glass · 个人名片工坊</title>
<style>
  :root{
    --accent:#5ee7ff;
    --accent2:#7c5cff;
    --panel-bg:linear-gradient(160deg,rgba(255,255,255,.10),rgba(255,255,255,.03));
    --panel-brd:rgba(255,255,255,.14);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;height:100%;overflow:hidden}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    background:#04070f;color:#eaf1ff;
    -webkit-font-smoothing:antialiased;
  }
  body::before,body::after{
    content:'';position:fixed;border-radius:50%;filter:blur(90px);
    opacity:.42;pointer-events:none;z-index:0;
  }
  body::before{
    width:75vmin;height:75vmin;left:-22vmin;top:-14vmin;
    background:radial-gradient(circle,#2b6cff,transparent 70%);
    animation:fl1 20s ease-in-out infinite;
  }
  body::after{
    width:85vmin;height:85vmin;right:-28vmin;bottom:-22vmin;
    background:radial-gradient(circle,#b23cff,transparent 70%);
    animation:fl2 26s ease-in-out infinite;
  }
  @keyframes fl1{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(12vmin,14vmin) scale(1.1)}}
  @keyframes fl2{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(-14vmin,-12vmin) scale(1.08)}}

  .app{position:relative;z-index:1;height:100%;height:100dvh;display:flex;flex-direction:column}

  .stage{flex:1 1 auto;min-height:0;display:flex;align-items:center;justify-content:center;padding:10px}
  .phone{
    position:relative;border-radius:26px;overflow:hidden;background:#050a16;
    box-shadow:0 34px 70px -26px rgba(0,0,0,.95),0 0 0 1px rgba(255,255,255,.10),0 0 60px -18px var(--accent);
    isolation:isolate;transition:box-shadow .4s;
  }
  .phone canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
  .phone::after{
    content:'';position:absolute;inset:0;border-radius:26px;pointer-events:none;
    box-shadow:inset 0 1.5px 0 rgba(255,255,255,.55),inset 0 0 0 1px rgba(255,255,255,.13);z-index:5;
  }

  .panel{
    flex:0 0 auto;max-height:62%;overflow-y:auto;-webkit-overflow-scrolling:touch;
    margin:0 10px calc(10px + env(safe-area-inset-bottom));padding:14px;border-radius:26px;
    background:var(--panel-bg);
    backdrop-filter:blur(26px) saturate(180%);-webkit-backdrop-filter:blur(26px) saturate(180%);
    border:1px solid var(--panel-brd);
    box-shadow:0 24px 50px -24px #000,inset 0 1px 0 rgba(255,255,255,.34);
    display:flex;flex-direction:column;gap:12px;scrollbar-width:none;
  }
  .panel::-webkit-scrollbar{display:none}

  .head{display:flex;align-items:center;gap:10px;padding:0 2px}
  .head h1{
    flex:1;font-size:15px;font-weight:800;margin:0;letter-spacing:.3px;
    background:linear-gradient(120deg,#fff,var(--accent) 60%,var(--accent2));
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .icon-btns{display:flex;gap:6px}
  .icon-btn{
    width:34px;height:34px;border-radius:12px;border:1px solid rgba(255,255,255,.14);
    background:rgba(255,255,255,.07);color:rgba(255,255,255,.78);
    font-size:15px;cursor:pointer;display:grid;place-items:center;font-family:inherit;
    transition:transform .16s cubic-bezier(.34,1.56,.64,1),background .2s,border-color .2s,opacity .2s;
  }
  .icon-btn:active{transform:scale(.9)}
  .icon-btn:disabled{opacity:.28;cursor:default}

  .row-label{
    font-size:10.5px;font-weight:700;letter-spacing:1.1px;
    color:rgba(255,255,255,.34);text-transform:uppercase;margin:0 0 7px 3px;
  }

  .chips{display:flex;gap:8px;overflow-x:auto;padding:2px 1px 4px;scrollbar-width:none;scroll-behavior:smooth}
  .chips::-webkit-scrollbar{display:none}
  .chip{
    flex:0 0 auto;display:inline-flex;align-items:center;gap:6px;
    padding:9px 14px;border-radius:15px;font-size:12.5px;font-weight:650;white-space:nowrap;
    background:rgba(255,255,255,.065);border:1px solid rgba(255,255,255,.12);
    color:rgba(255,255,255,.72);cursor:pointer;user-select:none;
    transition:transform .18s cubic-bezier(.34,1.56,.64,1),background .22s,border-color .22s,box-shadow .22s,color .22s;
  }
  .chip:active{transform:scale(.94)}
  .chip.active{
    background:linear-gradient(135deg,rgba(94,231,255,.26),rgba(124,92,255,.26));
    border-color:rgba(255,255,255,.42);color:#fff;
    box-shadow:0 8px 22px -10px var(--accent),inset 0 1px 0 rgba(255,255,255,.5);
  }

  .fields{display:flex;flex-direction:column;gap:8px}
  .field{
    display:flex;align-items:center;gap:10px;
    background:rgba(255,255,255,.055);border:1px solid rgba(255,255,255,.11);
    border-radius:15px;padding:0 14px;height:46px;
    transition:border-color .2s,box-shadow .2s,background .2s;
  }
  .field:focus-within{
    border-color:rgba(255,255,255,.4);background:rgba(255,255,255,.08);
    box-shadow:0 0 0 3px rgba(94,231,255,.10),inset 0 1px 0 rgba(255,255,255,.2);
  }
  .field label{
    font-size:11px;color:rgba(255,255,255,.42);flex:0 0 auto;font-weight:650;
    letter-spacing:.4px;max-width:76px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }
  .field input{
    flex:1;min-width:0;background:none;border:0;outline:0;
    color:#fff;font-size:14px;font-family:inherit;font-weight:500;
  }
  .field input::placeholder{color:rgba(255,255,255,.25)}

  .avatars{display:flex;gap:8px;overflow-x:auto;padding:2px 1px 4px;scrollbar-width:none;align-items:center}
  .avatars::-webkit-scrollbar{display:none}
  .av{
    flex:0 0 auto;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-size:19px;
    background:rgba(255,255,255,.06);border:1.5px solid rgba(255,255,255,.13);cursor:pointer;
    transition:transform .18s cubic-bezier(.34,1.56,.64,1),border-color .2s,box-shadow .2s,background .2s;
    overflow:hidden;
  }
  .av:active{transform:scale(.9)}
  .av.active{
    border-color:rgba(255,255,255,.7);
    background:linear-gradient(135deg,rgba(94,231,255,.22),rgba(124,92,255,.22));
    box-shadow:0 6px 18px -8px var(--accent),inset 0 1px 0 rgba(255,255,255,.4);
  }
  .av.upload{
    background:linear-gradient(135deg,rgba(94,231,255,.16),rgba(124,92,255,.16));
    border-style:dashed;font-size:18px;color:rgba(255,255,255,.8);
  }
  .av img{width:100%;height:100%;object-fit:cover;display:block}

  .bg-actions{display:flex;gap:8px}
  .bg-btn{
    flex:1;height:46px;border-radius:15px;
    border:1px solid rgba(255,255,255,.13);
    background:rgba(255,255,255,.06);
    color:rgba(255,255,255,.82);
    font-family:inherit;font-size:13px;font-weight:650;
    cursor:pointer;display:flex;align-items:center;justify-content:center;gap:7px;
    transition:transform .16s cubic-bezier(.34,1.56,.64,1),background .2s,border-color .2s,opacity .2s;
    position:relative;overflow:hidden;
  }
  .bg-btn:active{transform:scale(.96)}
  .bg-btn:disabled{opacity:.34;cursor:default}
  .bg-btn .ico{font-size:15px;line-height:1}
  .bg-btn.active{
    border-color:rgba(255,255,255,.4);
    background:linear-gradient(135deg,rgba(94,231,255,.16),rgba(124,92,255,.16));
    color:#fff;
  }
  .bg-btn .thumb{
    position:absolute;inset:0;background-size:cover;background-position:center;
    opacity:.42;
  }
  .bg-btn span{position:relative;z-index:1;text-shadow:0 1px 6px rgba(0,0,0,.7)}

  .swatches{display:flex;gap:10px;padding:2px 1px;align-items:center}
  .sw{
    width:34px;height:34px;border-radius:50%;cursor:pointer;position:relative;
    border:2px solid transparent;flex:0 0 auto;
    transition:transform .18s cubic-bezier(.34,1.56,.64,1),border-color .2s,box-shadow .2s;
  }
  .sw:active{transform:scale(.9)}
  .sw.active{border-color:#fff;box-shadow:0 0 0 3px rgba(255,255,255,.14),0 8px 18px -8px rgba(0,0,0,.8)}
  .sw.custom{
    display:grid;place-items:center;background:rgba(255,255,255,.07);
    border:1.5px dashed rgba(255,255,255,.3);position:relative;overflow:hidden;
  }
  .sw.custom::after{content:'+';font-size:18px;color:rgba(255,255,255,.7);font-weight:600;line-height:1;margin-top:-2px}
  .sw.custom input{
    position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%;border:0;padding:0;
  }
  .sw.custom.active{border-style:solid}

  .sliders{display:flex;flex-direction:column;gap:10px}
  .slider{
    display:flex;align-items:center;gap:10px;
    background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.10);
    border-radius:14px;padding:9px 14px;
  }
  .slider label{
    flex:0 0 62px;font-size:11.5px;font-weight:650;color:rgba(255,255,255,.52);letter-spacing:.3px;
  }
  .slider input[type=range]{
    flex:1;min-width:0;-webkit-appearance:none;appearance:none;background:none;height:22px;outline:0;
  }
  .slider input[type=range]::-webkit-slider-runnable-track{
    height:4px;border-radius:2px;background:rgba(255,255,255,.15);
  }
  .slider input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;appearance:none;width:16px;height:16px;border-radius:50%;
    background:#fff;margin-top:-6px;box-shadow:0 2px 8px rgba(0,0,0,.5),0 0 0 3px rgba(94,231,255,.18);
    border:0;cursor:pointer;
  }
  .slider input[type=range]::-moz-range-track{
    height:4px;border-radius:2px;background:rgba(255,255,255,.15);
  }
  .slider input[type=range]::-moz-range-thumb{
    width:16px;height:16px;border-radius:50%;background:#fff;border:0;
    box-shadow:0 2px 8px rgba(0,0,0,.5);cursor:pointer;
  }
  .slider .val{
    flex:0 0 38px;text-align:right;font-size:11px;font-weight:650;
    color:rgba(255,255,255,.62);font-variant-numeric:tabular-nums;
  }

  .btns-col{display:flex;flex-direction:column;gap:8px}
  .btn-export{
    width:100%;height:52px;border-radius:17px;border:0;
    background:linear-gradient(135deg,var(--accent),var(--accent2));
    color:#04101f;font-weight:850;font-size:15.5px;letter-spacing:.5px;font-family:inherit;
    box-shadow:0 16px 34px -14px var(--accent),0 6px 18px -10px var(--accent2),inset 0 1px 0 rgba(255,255,255,.65);
    cursor:pointer;transition:transform .16s cubic-bezier(.34,1.56,.64,1),filter .2s;
    position:relative;overflow:hidden;
  }
  .btn-export:active{transform:scale(.965)}
  .btn-export:disabled{opacity:.62;cursor:default}
  .btn-export.secondary{
    background:rgba(255,255,255,.08);color:rgba(255,255,255,.86);
    border:1px solid rgba(255,255,255,.16);box-shadow:inset 0 1px 0 rgba(255,255,255,.2);
    height:46px;font-size:13.5px;font-weight:700;
  }
  .btn-export.loading::after{
    content:'';position:absolute;left:0;top:0;height:100%;width:40%;
    background:linear-gradient(90deg,transparent,rgba(255,255,255,.35),transparent);
    animation:sweep 1.1s linear infinite;
  }
  @keyframes sweep{from{transform:translateX(-130%)}to{transform:translateX(330%)}}

  .modal{
    position:fixed;inset:0;z-index:80;display:none;place-items:center;padding:18px;
    background:rgba(2,5,12,.62);
    backdrop-filter:blur(22px) saturate(160%);-webkit-backdrop-filter:blur(22px) saturate(160%);
    animation:fadeIn .25s ease;
  }
  .modal.show{display:grid}
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}
  @keyframes pop{from{opacity:0;transform:scale(.9) translateY(18px)}to{opacity:1;transform:none}}

  .modal-card{
    width:min(100%,400px);max-height:92vh;overflow-y:auto;border-radius:28px;padding:20px;
    background:linear-gradient(160deg,rgba(255,255,255,.14),rgba(255,255,255,.05));
    border:1px solid rgba(255,255,255,.22);
    box-shadow:0 44px 90px -34px #000,0 0 70px -22px var(--accent),inset 0 1px 0 rgba(255,255,255,.55);
    backdrop-filter:blur(30px) saturate(180%);-webkit-backdrop-filter:blur(30px) saturate(180%);
    animation:pop .32s cubic-bezier(.34,1.4,.64,1);
    display:flex;flex-direction:column;gap:16px;scrollbar-width:none;
  }
  .modal-card::-webkit-scrollbar{display:none}

  .modal-head{display:flex;align-items:center;justify-content:space-between;gap:12px}
  .modal-head h2{
    margin:0;font-size:15px;font-weight:800;letter-spacing:.3px;
    background:linear-gradient(120deg,#fff,var(--accent));
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .modal-head .meta{
    font-size:11px;color:rgba(255,255,255,.46);background:rgba(255,255,255,.08);
    border:1px solid rgba(255,255,255,.13);padding:5px 10px;border-radius:20px;
    font-weight:650;white-space:nowrap;
  }

  .shot-wrap{
    border-radius:20px;overflow:hidden;background:rgba(0,0,0,.35);
    border:1px solid rgba(255,255,255,.16);
    box-shadow:0 20px 44px -22px #000,inset 0 1px 0 rgba(255,255,255,.3);
    display:grid;place-items:center;padding:10px;position:relative;min-height:160px;
  }
  .shot-wrap::before{
    content:'';position:absolute;inset:0;pointer-events:none;
    background:linear-gradient(140deg,rgba(255,255,255,.12),transparent 45%);
  }
  .shot-wrap img{
    display:block;max-width:100%;max-height:44vh;border-radius:14px;
    box-shadow:0 16px 40px -14px #000;background:#050a16;
  }
  .spinner{
    width:34px;height:34px;border-radius:50%;
    border:2.5px solid rgba(255,255,255,.15);border-top-color:var(--accent);
    animation:spin .8s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg)}}

  .modal-actions{display:flex;gap:10px}
  .btn{
    flex:1;height:50px;border-radius:16px;border:0;font-family:inherit;
    font-size:14.5px;font-weight:750;cursor:pointer;
    display:flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;
    transition:transform .16s cubic-bezier(.34,1.56,.64,1),filter .2s;
  }
  .btn:active{transform:scale(.96)}
  .btn.primary{
    background:linear-gradient(135deg,var(--accent),var(--accent2));color:#04101f;
    box-shadow:0 14px 30px -12px var(--accent),inset 0 1px 0 rgba(255,255,255,.6);
  }
  .btn.ghost{
    background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);
    color:rgba(255,255,255,.85);flex:0 0 auto;padding:0 20px;
  }

  .quality-row{display:none;align-items:center;gap:10px;padding:0 4px}
  .quality-row.show{display:flex}
  .quality-row label{font-size:11.5px;color:rgba(255,255,255,.5);font-weight:650;flex:0 0 auto}
  .quality-row input[type=range]{flex:1}
  .quality-row .val{font-size:11px;color:rgba(255,255,255,.62);font-weight:650;flex:0 0 34px;text-align:right;font-variant-numeric:tabular-nums}

  @media (min-width:900px){
    .app{flex-direction:row}
    .stage{flex:1 1 auto;padding:26px}
    .panel{
      width:396px;flex:0 0 396px;max-height:none;height:100%;margin:0;border-radius:0;
      border-right:0;border-top:0;border-bottom:0;padding:22px 20px;
      padding-bottom:calc(22px + env(safe-area-inset-bottom));
    }
    .head h1{font-size:17px}
    .phone{border-radius:32px}
  }
  @media (max-width:380px){
    .panel{padding:12px;gap:10px}
    .field{height:42px}
  }
</style>
</head>
<body>

<div class="app">
  <div class="stage" id="stage">
    <div class="phone" id="phone">
      <canvas id="bgC"></canvas>
      <canvas id="fgC"></canvas>
    </div>
  </div>

  <aside class="panel">
    <div class="head">
      <h1>Liquid Glass · 个人名片</h1>
      <div class="icon-btns">
        <button class="icon-btn" id="undoBtn" title="撤销 (Ctrl+Z)" disabled>↶</button>
        <button class="icon-btn" id="redoBtn" title="重做 (Ctrl+Shift+Z)" disabled>↷</button>
      </div>
    </div>

    <div>
      <div class="row-label">名片文字</div>
      <div class="fields">
        <div class="field">
          <label>姓名</label>
          <input id="in1" type="text" maxlength="20" placeholder="陈星知">
        </div>
        <div class="field">
          <label>职位</label>
          <input id="in2" type="text" maxlength="30" placeholder="手写设计师">
        </div>
      </div>
    </div>

    <div>
      <div class="row-label">联系信息</div>
      <div class="fields">
        <div class="field">
          <label>邮箱</label>
          <input id="contactEmailIn" type="text" maxlength="40" placeholder="3147154115@qq.com">
        </div>
        <div class="field">
          <label>电话</label>
          <input id="contactPhoneIn" type="text" maxlength="40" placeholder="qq 31471547154115">
        </div>
        <div class="field">
          <label>地址</label>
          <input id="contactAddressIn" type="text" maxlength="40" placeholder="Shanghai · 深空蓝工作室">
        </div>
      </div>
    </div>

    <div>
      <div class="row-label">头像</div>
      <div class="avatars" id="avatarRow"></div>
      <input type="file" id="avatarFile" accept="image/*" style="display:none">
    </div>

    <div>
      <div class="row-label">背景壁纸</div>
      <div class="bg-actions">
        <button class="bg-btn" id="uploadBgBtn">
          <span class="ico">🖼</span><span>上传壁纸</span>
        </button>
        <button class="bg-btn" id="resetBgBtn" disabled>
          <span class="ico">↺</span><span>恢复默认</span>
        </button>
      </div>
      <input type="file" id="bgFile" accept="image/*" style="display:none">
    </div>

    <div>
      <div class="row-label">主题色</div>
      <div class="swatches" id="swatchRow"></div>
    </div>

    <div>
      <div class="row-label">玻璃质感</div>
      <div class="sliders">
        <div class="slider">
          <label>模糊</label>
          <input type="range" id="blurSlider" min="4" max="60" step="1">
          <span class="val" id="blurVal"></span>
        </div>
        <div class="slider">
          <label>通透度</label>
          <input type="range" id="alphaSlider" min="30" max="150" step="1">
          <span class="val" id="alphaVal"></span>
        </div>
        <div class="slider">
          <label>高光</label>
          <input type="range" id="hlSlider" min="0" max="200" step="1">
          <span class="val" id="hlVal"></span>
        </div>
        <div class="slider">
          <label>圆角</label>
          <input type="range" id="radSlider" min="40" max="180" step="1">
          <span class="val" id="radVal"></span>
        </div>
      </div>
    </div>

    <div>
      <div class="row-label">导出格式</div>
      <div class="chips" id="fmtChips"></div>
      <div class="quality-row" id="qualityRow">
        <label>画质</label>
        <input type="range" id="qualitySlider" min="40" max="100" step="1">
        <span class="val" id="qualityVal"></span>
      </div>
    </div>

    <div>
      <div class="row-label">导出分辨率</div>
      <div class="chips" id="resChips"></div>
    </div>

    <div class="btns-col">
      <button class="btn-export" id="exportBtn">导出竖版图片</button>
      <button class="btn-export secondary" id="batchBtn">批量导出 · 全部分辨率</button>
    </div>
  </aside>
</div>

<div class="modal" id="modal">
  <div class="modal-card">
    <div class="modal-head">
      <h2>导出预览</h2>
      <div class="meta" id="modalMeta">—</div>
    </div>
    <div class="shot-wrap" id="shotWrap">
      <div class="spinner"></div>
    </div>
    <div class="modal-actions">
      <a class="btn primary" id="dlBtn" download>下载图片</a>
      <button class="btn ghost" id="closeBtn">关闭</button>
    </div>
  </div>
</div>

<script>
/* =========================================================
   常量
   ========================================================= */
const W = 540, H = 960;
const FF = '-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif';
const BLUR_W = 270, BLUR_H = 480;
const PREVIEW_W = 810, PREVIEW_H = 1440;

const PRESET_THEMES = [
  { name:'极光', colors:['#5ee7ff','#7c5cff','#ff6bd6','#31e1a8'] },
  { name:'落日', colors:['#ffb86b','#ff5f7e','#ff7ac8','#ffd36e'] },
  { name:'薄荷', colors:['#5ef2c0','#3ec9ff','#7cffd4','#4f8cff'] },
  { name:'星河', colors:['#8b7bff','#5a8cff','#c46bff','#4de0ff'] },
  { name:'蔷薇', colors:['#ff7ab8','#ff5f8f','#ffb0d4','#a06bff'] },
];

/* =========================================================
   工具
   ========================================================= */
const _hexCache = new Map();
function hexA(hex, a){
  let n = _hexCache.get(hex);
  if (n === undefined){ n = parseInt(hex.slice(1),16); _hexCache.set(hex,n); }
  return `rgba(${(n>>16)&255},${(n>>8)&255},${n&255},${a})`;
}
function rr(ctx,x,y,w,h,r){
  r = Math.max(0, Math.min(r, Math.abs(w)/2, Math.abs(h)/2));
  ctx.beginPath();
  ctx.moveTo(x+r, y);
  ctx.arcTo(x+w, y,   x+w, y+h, r);
  ctx.arcTo(x+w, y+h, x,   y+h, r);
  ctx.arcTo(x,   y+h, x,   y,   r);
  ctx.arcTo(x,   y,   x+w, y,   r);
  ctx.closePath();
}
function hexToHsl(hex){
  const r = parseInt(hex.slice(1,3),16)/255;
  const g = parseInt(hex.slice(3,5),16)/255;
  const b = parseInt(hex.slice(5,7),16)/255;
  const max = Math.max(r,g,b), min = Math.min(r,g,b);
  let h=0, s=0, l=(max+min)/2;
  if (max !== min){
    const d = max-min;
    s = l > 0.5 ? d/(2-max-min) : d/(max+min);
    if (max === r) h = (g-b)/d + (g<b?6:0);
    else if (max === g) h = (b-r)/d + 2;
    else h = (r-g)/d + 4;
    h /= 6;
  }
  return [h*360, s*100, l*100];
}
function hslToHex(h, s, l){
  h = ((h % 360) + 360) % 360;
  s = Math.max(0, Math.min(100, s)) / 100;
  l = Math.max(0, Math.min(100, l)) / 100;
  const k = n => (n + h/30) % 12;
  const a = s * Math.min(l, 1-l);
  const f = n => l - a * Math.max(-1, Math.min(k(n)-3, Math.min(9-k(n), 1)));
  const to = x => Math.round(Math.max(0,Math.min(1,x))*255).toString(16).padStart(2,'0');
  return '#' + to(f(0)) + to(f(8)) + to(f(4));
}
function makeCustomTheme(hex){
  const [h,s,l] = hexToHsl(hex);
  return {
    name:'自定义',
    colors:[
      hex,
      hslToHex(h+42, Math.min(100, s+8), Math.max(36, l-4)),
      hslToHex(h+300, Math.min(100, s+6), Math.min(82, l+10)),
      hslToHex(h+180, s*0.9, Math.max(42, l-2)),
    ]
  };
}

let cachedTheme = null;
function getThemeColors(){
  if (!cachedTheme){
    cachedTheme = state.customColor
      ? makeCustomTheme(state.customColor).colors
      : PRESET_THEMES[state.theme].colors;
  }
  return cachedTheme;
}
function invalidateTheme(){ cachedTheme = null; }

/* =========================================================
   背景
   ========================================================= */
function drawBg(ctx, phase){
  if (state.bgImage){
    const img = state.bgImage;
    const scale = Math.max(W / img.width, H / img.height);
    const dw = img.width * scale;
    const dh = img.height * scale;
    ctx.drawImage(img, (W-dw)/2, (H-dh)/2, dw, dh);

    ctx.fillStyle = 'rgba(4,7,15,.30)';
    ctx.fillRect(0,0,W,H);

    const T = getThemeColors();
    const tint = ctx.createLinearGradient(0,0,W,H);
    tint.addColorStop(0, hexA(T[0], .10));
    tint.addColorStop(1, hexA(T[1], .08));
    ctx.fillStyle = tint;
    ctx.fillRect(0,0,W,H);

    const vg = ctx.createRadialGradient(W*0.5,H*0.44,H*0.18, W*0.5,H*0.5,H*0.88);
    vg.addColorStop(0,'rgba(0,0,0,0)');
    vg.addColorStop(0.72,'rgba(1,3,8,.30)');
    vg.addColorStop(1,'rgba(1,3,8,.68)');
    ctx.fillStyle = vg;
    ctx.fillRect(0,0,W,H);
    return;
  }

  const T = getThemeColors();
  const g = ctx.createLinearGradient(0,0,W,H);
  g.addColorStop(0,   '#03060e');
  g.addColorStop(0.42,'#08172c');
  g.addColorStop(0.75,'#061024');
  g.addColorStop(1,   '#03060e');
  ctx.fillStyle = g;
  ctx.fillRect(0,0,W,H);

  const spots = [
    { x:0.14, y:0.10, r:0.78, c:0, s:1.00, ax:0.10, ay:0.07 },
    { x:0.90, y:0.24, r:0.66, c:1, s:1.42, ax:0.08, ay:0.10 },
    { x:0.22, y:0.74, r:0.82, c:2, s:0.82, ax:0.12, ay:0.08 },
    { x:0.88, y:0.90, r:0.70, c:3, s:1.68, ax:0.07, ay:0.09 },
    { x:0.50, y:0.46, r:0.58, c:1, s:1.12, ax:0.13, ay:0.11 },
  ];
  ctx.globalCompositeOperation = 'lighter';
  for (let i=0;i<spots.length;i++){
    const sp = spots[i];
    const x = sp.x*W + Math.sin(phase*sp.s + i*1.9) * W * sp.ax;
    const y = sp.y*H + Math.cos(phase*sp.s*0.85 + i*2.7) * H * sp.ay;
    const R = sp.r * Math.min(W,H) * 0.72;
    const col = T[sp.c % T.length];
    const rg = ctx.createRadialGradient(x,y,0, x,y,R);
    rg.addColorStop(0,    hexA(col, 0.42));
    rg.addColorStop(0.36, hexA(col, 0.17));
    rg.addColorStop(1,    hexA(col, 0));
    ctx.fillStyle = rg;
    ctx.beginPath(); ctx.arc(x,y,R,0,Math.PI*2); ctx.fill();
  }
  ctx.globalCompositeOperation = 'source-over';

  const vg = ctx.createRadialGradient(W*0.5,H*0.44,H*0.18, W*0.5,H*0.5,H*0.88);
  vg.addColorStop(0,'rgba(0,0,0,0)');
  vg.addColorStop(0.72,'rgba(1,3,8,.35)');
  vg.addColorStop(1,'rgba(1,3,8,.78)');
  ctx.fillStyle = vg;
  ctx.fillRect(0,0,W,H);
}

/* =========================================================
   玻璃面板
   ========================================================= */
function glassPanel(ctx, env, x, y, w, h, r, opt){
  opt = opt || {};
  const G = state.glass;
  const T = getThemeColors();
  const tint  = opt.tint  || T[0];
  const tint2 = opt.tint2 || T[1];
  const k     = (opt.k === undefined ? 1 : opt.k) * G.alpha;
  const radius = r * G.radius;
  const hlStrength = G.highlight;
  const blurImg = env && env.blur;

  ctx.save();

  if (opt.shadow !== false){
    ctx.save();
    ctx.shadowColor = 'rgba(0,0,0,.55)';
    ctx.shadowBlur = 34;
    ctx.shadowOffsetY = 16;
    rr(ctx,x,y,w,h,radius);
    ctx.fillStyle = 'rgba(6,12,24,.5)';
    ctx.fill();
    ctx.restore();
  }

  ctx.save();
  rr(ctx,x,y,w,h,radius);
  ctx.clip();

  if (blurImg){
    const bs = blurImg.width / W;
    ctx.drawImage(blurImg, x*bs, y*bs, w*bs, h*bs, x, y, w, h);
  }

  const g = ctx.createLinearGradient(x,y,x+w,y+h);
  g.addColorStop(0,    hexA(tint, 0.26*k));
  g.addColorStop(0.46, 'rgba(255,255,255,'+(0.075*k)+')');
  g.addColorStop(1,    hexA(tint2, 0.22*k));
  ctx.fillStyle = g;
  ctx.fillRect(x,y,w,h);

  const hl = ctx.createLinearGradient(0, y, 0, y + h*0.62);
  hl.addColorStop(0, 'rgba(255,255,255,'+(0.26*k*hlStrength)+')');
  hl.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = hl;
  ctx.fillRect(x, y, w, h*0.62);

  ctx.restore();

  rr(ctx,x,y,w,h,radius);
  ctx.lineWidth = Math.max(1, w*0.0032);
  const bg = ctx.createLinearGradient(x,y,x+w,y+h);
  bg.addColorStop(0,    'rgba(255,255,255,'+(0.82*Math.min(1.4,hlStrength))+')');
  bg.addColorStop(0.28, 'rgba(255,255,255,.14)');
  bg.addColorStop(0.72, 'rgba(255,255,255,.10)');
  bg.addColorStop(1,    'rgba(255,255,255,'+(0.62*Math.min(1.4,hlStrength))+')');
  ctx.strokeStyle = bg;
  ctx.stroke();

  ctx.restore();
}

/* =========================================================
   头像
   ========================================================= */
function drawAvatar(ctx,x,y,r){
  const T = getThemeColors();
  ctx.save();
  ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2);
  ctx.clip();

  if (state.avatarImg){
    const img = state.avatarImg;
    const ar = img.width / img.height;
    let dw = r*2, dh = r*2;
    if (ar > 1) dw = r*2*ar; else dh = r*2/ar;
    ctx.drawImage(img, x-dw/2, y-dh/2, dw, dh);
  } else {
    const g = ctx.createLinearGradient(x-r,y-r,x+r,y+r);
    g.addColorStop(0, hexA(T[0],.92));
    g.addColorStop(0.55, hexA(T[1],.85));
    g.addColorStop(1, hexA(T[2],.92));
    ctx.fillStyle = g;
    ctx.fillRect(x-r,y-r,r*2,r*2);

    const ig = ctx.createRadialGradient(x-r*0.4,y-r*0.5,0,x,y,r*1.3);
    ig.addColorStop(0,'rgba(255,255,255,.5)');
    ig.addColorStop(1,'rgba(255,255,255,0)');
    ctx.fillStyle = ig; ctx.fillRect(x-r,y-r,r*2,r*2);

    ctx.font = `${Math.round(r*1.16)}px ${FF}`;
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(state.avatar, x, y + r*0.05);
  }
  ctx.restore();

  ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2);
  ctx.strokeStyle='rgba(255,255,255,.6)';
  ctx.lineWidth = Math.max(1, r*0.08);
  ctx.stroke();
}

/* =========================================================
   唯一模板：个人名片 —— 联系信息从 state 读取
   ========================================================= */
function tplCard(ctx, env){
  const T = getThemeColors();
  const px = 44, py = 160, pw = W-88, ph = 640;
  glassPanel(ctx, env, px, py, pw, ph, 40, { k:1 });

  // 顶部光带
  ctx.save();
  rr(ctx, px, py, pw, ph, 40*state.glass.radius);
  ctx.clip();
  const g = ctx.createLinearGradient(px, py, px+pw, py+180);
  g.addColorStop(0, hexA(T[0],.28));
  g.addColorStop(0.5, hexA(T[1],.16));
  g.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = g;
  ctx.fillRect(px, py, pw, 180);
  ctx.restore();

  // 头像
  const ax = W/2, ay = py+130;
  drawAvatar(ctx, ax, ay, 58);

  // 装饰环
  ctx.beginPath(); ctx.arc(ax, ay, 72, 0, Math.PI*2);
  ctx.strokeStyle = 'rgba(255,255,255,.12)';
  ctx.lineWidth = 1;
  ctx.stroke();

  // 姓名
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillStyle = '#fff';
  ctx.font = `750 30px ${FF}`;
  const title = state.title || '陈星知';
  ctx.fillText(title, W/2, py+240, pw-70);

  // 职位
  ctx.fillStyle = 'rgba(255,255,255,.6)';
  ctx.font = `400 15px ${FF}`;
  ctx.fillText(state.subtitle || '手写设计师', W/2, py+278, pw-70);

  // 分隔线
  ctx.fillStyle = 'rgba(255,255,255,.12)';
  ctx.fillRect(px+50, py+322, pw-100, 1);

  // 联系信息（可编辑）
  const rows = [
    { i:'✉', l: state.contactEmail   || '3147154115@qq.com' },
    { i:'☎', l: state.contactPhone   || 'qq 31471547154115' },
    { i:'⚲', l: state.contactAddress || 'Shanghai · 深空蓝工作室' },
  ];
  const sy = py+362;
  for (let k=0;k<rows.length;k++){
    const ry = sy + k*52;
    // 图标框
    ctx.fillStyle = 'rgba(255,255,255,.08)';
    rr(ctx, px+42, ry-16, 32, 32, 10); ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,.13)';
    ctx.lineWidth = 1; ctx.stroke();

    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillStyle = hexA(T[0],1);
    ctx.font = `15px ${FF}`;
    ctx.fillText(rows[k].i, px+58, ry+1);

    // 文字（长文本自动缩字号）
    let fs = 14.5;
    ctx.font = `500 ${fs}px ${FF}`;
    const maxW = pw - 100;
    while (ctx.measureText(rows[k].l).width > maxW && fs > 10){
      fs -= 0.5;
      ctx.font = `500 ${fs}px ${FF}`;
    }
    ctx.textAlign='left';
    ctx.fillStyle = 'rgba(255,255,255,.82)';
    ctx.fillText(rows[k].l, px+88, ry+1, maxW);
  }

  // 底部主按钮
  const by = py+ph-58;
  const bg2 = ctx.createLinearGradient(px+42, 0, px+pw-42, 0);
  bg2.addColorStop(0, T[0]);
  bg2.addColorStop(1, T[1]);
  ctx.fillStyle = bg2;
  rr(ctx, px+42, by-26, pw-84, 52, 26); ctx.fill();

  ctx.save();
  rr(ctx, px+42, by-26, pw-84, 52, 26); ctx.clip();
  const sh = ctx.createLinearGradient(0,by-26,0,by+26);
  sh.addColorStop(0,'rgba(255,255,255,.35)');
  sh.addColorStop(1,'rgba(255,255,255,0)');
  ctx.fillStyle = sh; ctx.fillRect(px+42, by-26, pw-84, 52);
  ctx.restore();

  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillStyle = '#04121f';
  ctx.font = `750 15px ${FF}`;
  ctx.fillText('保存联系方式', W/2, by+1);
}

function drawTemplate(ctx, env){
  ctx.textAlign = 'left';
  ctx.textBaseline = 'alphabetic';
  tplCard(ctx, env);
}

/* =========================================================
   画布 & 渲染循环
   ========================================================= */
const bgC = document.getElementById('bgC');
const fgC = document.getElementById('fgC');
const phoneEl = document.getElementById('phone');

bgC.width = PREVIEW_W; bgC.height = PREVIEW_H;
fgC.width = PREVIEW_W; fgC.height = PREVIEW_H;

const blurCanvas = document.createElement('canvas');
blurCanvas.width = BLUR_W; blurCanvas.height = BLUR_H;
const blurCtx = blurCanvas.getContext('2d');

let phase = 0;
let lastFrame = 0;
let frCount = 0;

function renderBg(){
  const S = bgC.width / W;
  const ctx = bgC.getContext('2d');
  ctx.setTransform(1,0,0,1,0,0);
  ctx.clearRect(0,0,bgC.width,bgC.height);
  ctx.setTransform(S,0,0,S,0,0);
  drawBg(ctx, phase);
}

function updateBlur(){
  blurCtx.setTransform(1,0,0,1,0,0);
  blurCtx.clearRect(0,0,BLUR_W,BLUR_H);
  blurCtx.filter = `blur(${state.glass.blur * (BLUR_W/W)}px)`;
  blurCtx.drawImage(bgC, 0, 0, bgC.width, bgC.height, 0, 0, BLUR_W, BLUR_H);
  blurCtx.filter = 'none';
}

function renderFg(){
  const S = fgC.width / W;
  const ctx = fgC.getContext('2d');
  ctx.setTransform(1,0,0,1,0,0);
  ctx.clearRect(0,0,fgC.width,fgC.height);
  ctx.setTransform(S,0,0,S,0,0);
  if (state.breathe){
    const fy = Math.sin(phase*0.62) * 2.6;
    ctx.translate(0, fy);
  }
  drawTemplate(ctx, { blur: blurCanvas });
}

function refresh(){ updateBlur(); renderFg(); }
function refreshAll(){ renderBg(); updateBlur(); renderFg(); }

function loop(now){
  requestAnimationFrame(loop);
  if (document.hidden) return;
  if (now - lastFrame < 32) return;
  lastFrame = now;
  phase += 0.0125;
  frCount++;
  renderBg();
  if (frCount % 2 === 0) updateBlur();
  renderFg();
}
requestAnimationFrame(loop);

function layout(){
  const stage = document.getElementById('stage');
  const r = stage.getBoundingClientRect();
  const availW = Math.max(120, r.width  - 16);
  const availH = Math.max(200, r.height - 16);
  let h = availH, w = h * 9 / 16;
  if (w > availW){ w = availW; h = w * 16 / 9; }
  phoneEl.style.width  = Math.floor(w) + 'px';
  phoneEl.style.height = Math.floor(h) + 'px';
  refresh();
}

    const el = document.createElement('div');
    el.className = 'sw' + (!state.customColor && i === state.theme ? ' active' : '');
    el.style.background = `linear-gradient(135deg,${t.colors[0]},${t.colors[1]},${t.colors[2]})`;
    el.title = t.name;
    el.onclick = ()=>{
      state.theme = i;
      state.customColor = null;
      invalidateTheme();
      renderSwatches();
      applyThemeVars();
      refreshAll();
      scheduleHistory();
    };
    swatchRow.appendChild(el);
  });
  const cust = document.createElement('div');
  cust.className = 'sw custom' + (state.customColor ? ' active' : '');
  if (state.customColor){
    cust.style.background = `linear-gradient(135deg, ${state.customColor}, ${makeCustomTheme(state.customColor).colors[1]})`;
  }
  const picker = document.createElement('input');
  picker.type = 'color';
  picker.value = state.customColor || getThemeColors()[0];
  picker.oninput = (e)=>{
    state.customColor = e.target.value;
    invalidateTheme();
    renderSwatches();
    applyThemeVars();
    refreshAll();
  };
  picker.onchange = ()=> scheduleHistory();
  cust.appendChild(picker);
  cust.title = '自定义颜色';
  swatchRow.appendChild(cust);
}

function applyThemeVars(){
  const c = getThemeColors();
  document.documentElement.style.setProperty('--accent', c[0]);
  document.documentElement.style.setProperty('--accent2', c[1]);
}
renderSwatches();
applyThemeVars();

/* 玻璃滑块 */
const sliders = [
  { id:'blurSlider',  key:'blur',     val:'blurVal',  fmt:v=>v+'px', min:4, max:60 },
  { id:'alphaSlider', key:'alpha',    val:'alphaVal', fmt:v=>Math.round(v*100)+'%', min:30, max:150, div:100 },
  { id:'hlSlider',    key:'highlight',val:'hlVal',    fmt:v=>Math.round(v*100)+'%', min:0, max:200, div:100 },
  { id:'radSlider',   key:'radius',   val:'radVal',   fmt:v=>v.toFixed(2)+'×', min:40, max:180, div:100 },
];
sliders.forEach(s=>{
  const el = document.getElementById(s.id);
  const valEl = document.getElementById(s.val);
  const initV = s.div ? Math.round(state.glass[s.key] * s.div) : state.glass[s.key];
  el.value = initV;
  valEl.textContent = s.fmt(initV / (s.div||1));
  el.oninput = ()=>{
    const raw = +el.value;
    state.glass[s.key] = s.div ? raw / s.div : raw;
    valEl.textContent = s.fmt(raw / (s.div||1));
    refresh();
  };
  el.onchange = ()=> scheduleHistory();
});

/* 画质 */
const qualitySlider = document.getElementById('qualitySlider');
const qualityVal = document.getElementById('qualityVal');
qualitySlider.value = Math.round(state.quality * 100);
qualityVal.textContent = qualitySlider.value + '%';
qualitySlider.oninput = ()=>{
  state.quality = +qualitySlider.value / 100;
  qualityVal.textContent = qualitySlider.value + '%';
};

/* 文字输入（姓名 / 职位 / 联系信息） */
let inputTimer = null;
function bindTextInput(inputEl, key, fallback){
  inputEl.value = state[key];
  inputEl.addEventListener('input', ()=>{
    state[key] = inputEl.value;
    clearTimeout(inputTimer);
    inputTimer = setTimeout(refresh, 60);
  });
  inputEl.addEventListener('change', ()=>{
    if (!inputEl.value && fallback) {
      state[key] = fallback;
      inputEl.value = fallback;
    }
    refresh();
    scheduleHistory();
  });
}
bindTextInput(in1, 'title', '陈星知');
bindTextInput(in2, 'subtitle', '手写设计师');
bindTextInput(contactEmailIn,   'contactEmail',   '3147154115@qq.com');
bindTextInput(contactPhoneIn,   'contactPhone',   'qq 31471547154115');
bindTextInput(contactAddressIn, 'contactAddress', 'Shanghai · 深空蓝工作室');

/* =========================================================
   撤销 / 重做
   ========================================================= */
const undoBtn = document.getElementById('undoBtn');
const redoBtn = document.getElementById('redoBtn');

let historyStack = [];
let historyIdx = -1;
let historyTimer = null;

function getSnapshot(){
  return JSON.stringify({
    title: state.title,
    subtitle: state.subtitle,
    contactEmail: state.contactEmail,
    contactPhone: state.contactPhone,
    contactAddress: state.contactAddress,
    avatar: state.avatar,
    avatarImgSrc: state.avatarImg ? state.avatarImg.src : null,
    theme: state.theme,
    customColor: state.customColor,
    glass: state.glass,
    format: state.format,
    quality: state.quality,
  });
}

function pushHistory(){
  const snap = getSnapshot();
  if (historyIdx >= 0 && historyStack[historyIdx] === snap) return;
  historyStack = historyStack.slice(0, historyIdx + 1);
  historyStack.push(snap);
  if (historyStack.length > 40) historyStack.shift();
  historyIdx = historyStack.length - 1;
  updateHistoryButtons();
}

function scheduleHistory(){
  clearTimeout(historyTimer);
  historyTimer = setTimeout(pushHistory, 450);
}

function updateHistoryButtons(){
  undoBtn.disabled = historyIdx <= 0;
  redoBtn.disabled = historyIdx >= historyStack.length - 1;
}

function applySnapshot(snapStr){
  const snap = JSON.parse(snapStr);
  state.title = snap.title;
  state.subtitle = snap.subtitle;
  state.contactEmail = snap.contactEmail;
  state.contactPhone = snap.contactPhone;
  state.contactAddress = snap.contactAddress;
  state.avatar = snap.avatar;
  state.theme = snap.theme;
  state.customColor = snap.customColor;
  state.glass = snap.glass || state.glass;
  state.format = snap.format || 'png';
  state.quality = snap.quality == null ? 0.92 : snap.quality;

  if (snap.avatarImgSrc){
    const img = new Image();
    img.onload = ()=>{ state.avatarImg = img; refresh(); };
    img.src = snap.avatarImgSrc;
    state.avatarImg = null;
  } else {
    state.avatarImg = null;
  }

  in1.value = snap.title;
  in2.value = snap.subtitle;
  contactEmailIn.value = snap.contactEmail;
  contactPhoneIn.value = snap.contactPhone;
  contactAddressIn.value = snap.contactAddress;

  [...fmtChips.children].forEach(c=>c.classList.toggle('active', c.dataset.id === state.format));
  qualityRow.classList.toggle('show', state.format !== 'png');
  qualitySlider.value = Math.round(state.quality * 100);
  qualityVal.textContent = qualitySlider.value + '%';

  sliders.forEach(s=>{
    const el = document.getElementById(s.id);
    const raw = s.div ? Math.round(state.glass[s.key] * s.div) : state.glass[s.key];
    el.value = raw;
    document.getElementById(s.val).textContent = s.fmt(raw / (s.div||1));
  });

  invalidateTheme();
  renderSwatches();
  applyThemeVars();
  renderAvatarRow();
  refreshAll();
  updateHistoryButtons();
}

function undo(){
  if (historyIdx <= 0) return;
  historyIdx--;
  applySnapshot(historyStack[historyIdx]);
  updateHistoryButtons();
}
function redo(){
  if (historyIdx >= historyStack.length - 1) return;
  historyIdx++;
  applySnapshot(historyStack[historyIdx]);
  updateHistoryButtons();
}
undoBtn.onclick = undo;
redoBtn.onclick = redo;

document.addEventListener('keydown', (e)=>{
  const meta = e.ctrlKey || e.metaKey;
  if (!meta) return;
  if (e.key === 'z' && !e.shiftKey){ e.preventDefault(); undo(); }
  else if ((e.key === 'z' && e.shiftKey) || e.key === 'y'){ e.preventDefault(); redo(); }
  else if (e.key === 'e'){ e.preventDefault(); document.getElementById('exportBtn').click(); }
});

/* =========================================================
   导出
   ========================================================= */
const modal    = document.getElementById('modal');
const shotWrap = document.getElementById('shotWrap');
const modalMeta= document.getElementById('modalMeta');
const dlBtn    = document.getElementById('dlBtn');
const closeBtn = document.getElementById('closeBtn');
const exportBtn= document.getElementById('exportBtn');
const batchBtn = document.getElementById('batchBtn');

let currentURL = null;

function makeBlurLayer(bgCanvas, targetW){
  const scale = targetW / W;
  const bs = Math.min(scale, 0.6);
  const c = document.createElement('canvas');
  c.width  = Math.max(1, Math.round(W * bs));
  c.height = Math.max(1, Math.round(H * bs));
  const x = c.getContext('2d');
  x.filter = `blur(${state.glass.blur * bs}px)`;
  x.drawImage(bgCanvas, 0, 0, c.width, c.height);
  x.filter = 'none';
  return c;
}

function buildExportCanvas(targetW){
  const scale = targetW / W;
  const canvas = document.createElement('canvas');
  canvas.width  = targetW;
  canvas.height = Math.round(H * scale);
  const ctx = canvas.getContext('2d');

  const bgCan = document.createElement('canvas');
  bgCan.width = canvas.width;
  bgCan.height = canvas.height;
  const bgx = bgCan.getContext('2d');
  bgx.setTransform(scale, 0, 0, scale, 0, 0);
  drawBg(bgx, phase);

  const bl = makeBlurLayer(bgCan, targetW);

  ctx.drawImage(bgCan, 0, 0);
  ctx.setTransform(scale, 0, 0, scale, 0, 0);
  drawTemplate(ctx, { blur: bl });

  return canvas;
}

function canvasToBlob(canvas){
  return new Promise(res=>{
    canvas.toBlob(b=>res(b), FORMATS.find(f=>f.id===state.format).mime, state.quality);
  });
}

function downloadBlob(blob, name){
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = name;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(()=> URL.revokeObjectURL(url), 4000);
}

exportBtn.addEventListener('click', async ()=>{
  exportBtn.disabled = true;
  exportBtn.classList.add('loading');
  exportBtn.textContent = '正在渲染…';

  await new Promise(r=> requestAnimationFrame(()=> setTimeout(r, 30)));

  const res = RES[state.res];
  const fmt = FORMATS.find(f=>f.id === state.format);
  let canvas;
  try {
    canvas = buildExportCanvas(res.w);
  } catch(e){
    console.error(e);
    exportBtn.disabled = false;
    exportBtn.classList.remove('loading');
    exportBtn.textContent = '导出竖版图片';
    alert('渲染失败，请尝试降低分辨率或刷新页面。');
    return;
  }

  modalMeta.textContent = `${res.label} · ${canvas.width}×${canvas.height} · ${fmt.label}`;
  shotWrap.innerHTML = '<div class="spinner"></div>';
  modal.classList.add('show');

  const blob = await canvasToBlob(canvas);
  if (currentURL) URL.revokeObjectURL(currentURL);
  currentURL = URL.createObjectURL(blob);

  const img = new Image();
  img.onload = ()=>{
    shotWrap.innerHTML = '';
    shotWrap.appendChild(img);
  };
  img.onerror = ()=>{
    shotWrap.innerHTML = '<div style="padding:24px;font-size:13px;color:rgba(255,255,255,.6)">预览生成失败，仍可下载</div>';
  };
  img.src = currentURL;

  dlBtn.href = currentURL;
  dlBtn.download = `liquid-glass-card-${canvas.width}x${canvas.height}.${fmt.ext}`;

  exportBtn.disabled = false;
  exportBtn.classList.remove('loading');
  exportBtn.textContent = '导出竖版图片';
});

batchBtn.addEventListener('click', async ()=>{
  if (!confirm('将依次导出 4K / 2K / 1080P / 720P 四张图片，可能需要几秒，确定继续？')) return;
  batchBtn.disabled = true;
  const orig = batchBtn.textContent;

  const fmt = FORMATS.find(f=>f.id === state.format);

  for (let i=0; i<RES.length; i++){
    const res = RES[i];
    batchBtn.textContent = `正在导出 ${res.label} (${i+1}/${RES.length})…`;
    await new Promise(r=> requestAnimationFrame(()=> setTimeout(r, 30)));

    try {
      const canvas = buildExportCanvas(res.w);
      const blob = await canvasToBlob(canvas);
      downloadBlob(blob, `liquid-glass-card-${canvas.width}x${canvas.height}.${fmt.ext}`);
    } catch(e){
      console.error('批量导出失败：', res.label, e);
    }
    await new Promise(r=> setTimeout(r, 550));
  }

  batchBtn.disabled = false;
  batchBtn.textContent = orig;
});

closeBtn.addEventListener('click', ()=> modal.classList.remove('show'));
modal.addEventListener('click', e=>{ if (e.target === modal) modal.classList.remove('show'); });

/* =========================================================
   初始化
   ========================================================= */
function init(){
  renderBg();
  updateBlur();
  layout();
  pushHistory();

  if (window.ResizeObserver){
    let rid = null;
    const ro = new ResizeObserver(()=>{
      if (rid) cancelAnimationFrame(rid);
      rid = requestAnimationFrame(layout);
    });
    ro.observe(document.getElementById('stage'));
  }
  window.addEventListener('orientationchange', ()=> setTimeout(layout, 260));
  window.addEventListener('resize', ()=> setTimeout(layout, 120));
}
init();
</script>
